name: Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verification gate
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: corepack enable
      - name: Install ripgrep
        run: |
          archive=ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            "https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/$archive" \
            --output "$RUNNER_TEMP/$archive"
          echo "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ripgrep-14.1.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg" --version
      - name: Trust the mounted checkout for Git hooks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:browser
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: tmp/playwright
          if-no-files-found: ignore
