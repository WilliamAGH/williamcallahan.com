# lefthook.yml — Git hook configuration (replaces .husky/)
# Pre-commit: lint-fix then format staged files (piped: both rewrite the same files)
# Pre-push: production build + verification gate (sequential)

pre-commit:
  piped: true
  commands:
    oxlint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --type-aware --fix {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxfmt -c config/oxfmtrc.json --write {staged_files}
      stage_fixed: true

pre-push:
  piped: true
  commands:
    build:
      run: USE_NEXTJS_CACHE=false SKIP_BUILD_VALIDATIONS=1 pnpm run build
    verify:
      run: pnpm run verify
