# lefthook.yml — Git hook configuration (replaces .husky/)
# Pre-commit: lint-fix then format staged files (piped: both rewrite the same files)
# Pre-push: production build + verification gate (sequential) for branch pushes

pre-commit:
  piped: true
  commands:
    oxlint:
      priority: 1
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --type-aware --fix {staged_files}
      stage_fixed: true
    oxfmt:
      priority: 2
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxfmt -c config/oxfmtrc.json --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    build-and-verify:
      use_stdin: true
      # refs/wip/* only shares unlanded work between hosts; a branch push ships, so only it pays
      # for the build, which also needs a .env that most fleet hosts lack
      run: |
        gated=0
        while read -r local_ref local_oid remote_ref remote_oid; do
          case "$remote_ref" in refs/wip/*) ;; *) gated=1 ;; esac
        done
        [ "$gated" = 0 ] && exit 0
        USE_NEXTJS_CACHE=false SKIP_BUILD_VALIDATIONS=1 pnpm run build && pnpm run verify
