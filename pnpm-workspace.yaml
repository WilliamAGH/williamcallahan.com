packages:
  - .

# One machine-wide virtual store; next.config.ts gives Turbopack that store as an extra root.
# The Docker image ships node_modules, so its install sets pnpm_config_virtual_store_type=project.
virtualStoreType: global

# pnpm >= 11 reads project settings only from this file; the `pnpm` field of package.json is
# never read, and an install fails when a dependency's install script is not listed here.
allowBuilds:
  "@ast-grep/cli": true
  "@clerk/shared": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true

overrides:
  ansi-styles: 4.3.0
  baseline-browser-mapping: 2.9.19
  import-in-the-middle: 1.14.4

# A dependency's type declarations resolve from its own store entry, which reaches only its
# declared dependencies. Declaring these peers links the project's eslint and vitest into the
# entries whose declarations import them.
packageExtensions:
  "@eslint/config-helpers": { peerDependencies: { eslint: "*" } }
  "@testing-library/jest-dom": { peerDependencies: { vitest: "*" } }
  eslint-plugin-oxlint: { peerDependencies: { eslint: "*" } }
